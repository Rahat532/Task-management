{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Authentication System</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-lg w-full bg-white shadow-lg rounded-2xl p-8">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Welcome to Authentication System</h1>

        <div>
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="username" class="block mb-2 text-gray-700 font-medium">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter Your Username" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label for="password" class="block mb-2 text-gray-700 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Your Password" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
                    Sign In
                </button>

            </form>
        </div>

    </div>
</body>

</html>
