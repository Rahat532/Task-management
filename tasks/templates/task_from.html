{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
    <div class="w-1/2 mx-auto mt-8 ">
        <div>
            {% if message %}
            <p>{{ message }}</p>
            {% endif %}
        </div>
        <form method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-rose-500">Submit</button>
        </form>
    </div>
</body>
</html>
